# YamBMS - FelicityESS LUX-Y-48300LG01 Sensors package
# Native Modbus RTU register mapping (verified via Felicity / Venus-OS protocol):
# - Status & Faults: 0x1302 (Status Bitmask), 0x1304 (Fault Bitmask)
# - Pack telemetry: 0x1306 (Total Voltage), 0x1307 (Current: negative=discharge, positive=charge), 0x130A (MOS Temp), 0x130B (SoC)
# - BMS DVCC Limits: 0x131C (Max Charge V -> dynamically updates YamBMS Bulk V), 0x131D (Min Discharge V), 0x131E (Live Dynamic Charge Current), 0x131F (Live Dynamic Discharge Current)
# - Cells & Temps: 0x132A..0x1339 (16 Cells), 0x133A..0x133D (4 Cell Temperatures)

packages:
  bms_base: !include bms_base.yaml
  bms_temperature_sensor: !include bms_temperature_sensor_4.yaml

# +--------------------------------------+
# | Modbus Controller                    |
# +--------------------------------------+

modbus_controller:
  - id: modbus_controller_bms${bms_id}
    address: ${bms_id}
    modbus_id: ${felicity_modbus_id}
    command_throttle: ${felicity_modbus_command_throttle}
    update_interval: ${felicity_modbus_update_interval}
    on_online:
      then:
        - logger.log: "Felicity BMS ${bms_id} ONLINE"
        - lambda: |-
            id(bms${bms_id}_online_status).publish_state(true);
            id(bms${bms_id}_charging_allowed).publish_state(true);
            id(bms${bms_id}_discharging_allowed).publish_state(true);
    on_offline:
      then:
        - logger.log: "Felicity BMS ${bms_id} OFFLINE! Fail-safe active."
        - lambda: |-
            id(bms${bms_id}_online_status).publish_state(false);
            id(bms${bms_id}_charging_allowed).publish_state(false);
            id(bms${bms_id}_discharging_allowed).publish_state(false);
            id(bms${bms_id}_total_voltage).publish_state(0);
            id(bms${bms_id}_current).publish_state(0);
            id(bms${bms_id}_power).publish_state(0);

# +--------------------------------------+
# | Binary Sensors                       |
# +--------------------------------------+

binary_sensor:
  - platform: template
    id: bms${bms_id}_online_status
    device_id: bms_${bms_id}
    name: "online status"
    trigger_on_initial_state: true
    on_state:
      then:
        - lambda: |-
            id(global_update_fault)(${CAT_BMS}, ${bms_id}, !x);
    lambda: |-
      return id(bms${bms_id}_total_voltage).has_state() && id(bms${bms_id}_total_voltage).state > 40.0;

  - platform: template
    id: bms${bms_id}_charging_allowed
    device_id: bms_${bms_id}
    name: "charging allowed"
    lambda: |-
      if (id(bms${bms_id}_bms_status_raw).has_state()) {
        uint16_t st = (uint16_t)id(bms${bms_id}_bms_status_raw).state;
        return (st & 0x0001) != 0;
      }
      return id(bms${bms_id}_online_status).state && (!id(bms${bms_id}_max_cell_voltage).has_state() || id(bms${bms_id}_max_cell_voltage).state < 3.65);

  - platform: template
    id: bms${bms_id}_discharging_allowed
    device_id: bms_${bms_id}
    name: "discharging allowed"
    lambda: |-
      if (id(bms${bms_id}_bms_status_raw).has_state()) {
        uint16_t st = (uint16_t)id(bms${bms_id}_bms_status_raw).state;
        return (st & 0x0004) != 0;
      }
      return id(bms${bms_id}_online_status).state && (!id(bms${bms_id}_min_cell_voltage).has_state() || id(bms${bms_id}_min_cell_voltage).state > 2.50);

  - platform: template
    id: bms${bms_id}_bms_equalizing
    device_id: bms_${bms_id}
    name: "balancing"
    lambda: return false;

# +--------------------------------------+
# | Sensors                              |
# +--------------------------------------+

sensor:
  # +---------------------------------------------------+
  # | Pack Telemetry (Holding Registers 0x1302 - 0x130B)|
  # +---------------------------------------------------+

  # Register 0x1302 (4866): BMS Status Bitmask (bit 0 = charge FET, bit 2 = discharge FET)
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_bms_status_raw
    address: 0x1302
    register_type: holding
    value_type: U_WORD

  # Register 0x1304 (4868): BMS Fault Bitmask
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_bms_fault_raw
    address: 0x1304
    register_type: holding
    value_type: U_WORD

  # Register 0x1306 (4870): Total Pack Voltage (scale 0.01 V)
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_total_voltage
    device_id: bms_${bms_id}
    name: "total voltage"
    address: 0x1306
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Register 0x1307 (4871): Pack Current (int16 signed, scale 0.1 A)
  # Felicity Modbus RTU convention: positive=discharge, negative=charge.
  # Multiplied by -0.1 to convert to YamBMS / Pylontech standard (positive=charge, negative=discharge).
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_current
    device_id: bms_${bms_id}
    name: "current"
    address: 0x1307
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: -0.1

  # Register 0x130A (4874): BMS MOS Temperature (int16, °C)
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_temperature_sensor_mos
    device_id: bms_${bms_id}
    name: "mos temperature"
    address: 0x130A
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  # Register 0x130B (4875): State of Charge (%)
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_state_of_charge
    device_id: bms_${bms_id}
    name: "state of charge"
    address: 0x130B
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0

  # +---------------------------------------------------+
  # | BMS Limits (Holding Registers 0x131C - 0x131F)    |
  # +---------------------------------------------------+

  # Register 0x131C (4892): BMS Charge Voltage Limit (scale 0.01 V / 0.1 V)
  # Live reading from Felicity BMS dynamically updates YamBMS Bulk Voltage!
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_charge_voltage_limit
    device_id: bms_${bms_id}
    name: "charge voltage limit"
    address: 0x131C
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (x > 1000.0f) return x * 0.01f;
          return x * 0.1f;
    on_value:
      then:
        - lambda: |-
            if (x >= 48.0f && x <= 60.0f) {
              id(yambms${yambms_id}_bulk_voltage).publish_state(x);
            }

  # Register 0x131D (4893): BMS Discharge Voltage Limit (scale 0.01 V / 0.1 V)
  # Live reading from Felicity BMS dynamically updates YamBMS Requested Discharge Voltage!
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_discharge_voltage_limit
    device_id: bms_${bms_id}
    name: "discharge voltage limit"
    address: 0x131D
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: |-
          if (x > 1000.0f) return x * 0.01f;
          return x * 0.1f;
    on_value:
      then:
        - lambda: |-
            if (x >= 40.0f && x <= 55.0f) {
              id(yambms${yambms_id}_requested_discharge_voltage).publish_state(x);
            }

  # Register 0x131E (4894): Real-time Dynamic Charge Current Limit from Felicity BMS (scale 0.1 A)
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_bms_max_charge_current_raw
    device_id: bms_${bms_id}
    name: "bms dynamic charge current"
    address: 0x131E
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Register 0x131F (4895): Real-time Dynamic Discharge Current Limit from Felicity BMS (scale 0.1 A)
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_bms_max_discharge_current_raw
    device_id: bms_${bms_id}
    name: "bms dynamic discharge current"
    address: 0x131F
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Power (Calculated from Total Voltage * Current)
  - platform: template
    id: bms${bms_id}_power
    device_id: bms_${bms_id}
    name: "power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: ${bms_update_interval}
    lambda: |-
      if (!id(bms${bms_id}_total_voltage).has_state() || !id(bms${bms_id}_current).has_state()) return NAN;
      float p = id(bms${bms_id}_total_voltage).state * id(bms${bms_id}_current).state;
      if (p > 0) {
        id(bms${bms_id}_charging_power).publish_state(p);
        id(bms${bms_id}_discharging_power).publish_state(0);
      } else {
        id(bms${bms_id}_charging_power).publish_state(0);
        id(bms${bms_id}_discharging_power).publish_state(-p);
      }
      return p;

  - platform: template
    id: bms${bms_id}_charging_power
    device_id: bms_${bms_id}
    name: "charging power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    id: bms${bms_id}_discharging_power
    device_id: bms_${bms_id}
    name: "discharging power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0

  # Remaining capacity in Ah (Calculated from 300Ah nominal * SoC%)
  - platform: template
    id: bms${bms_id}_capacity_remaining_ah
    device_id: bms_${bms_id}
    name: "remaining capacity"
    unit_of_measurement: "Ah"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: ${bms_update_interval}
    lambda: |-
      if (!id(bms${bms_id}_state_of_charge).has_state()) return NAN;
      return 300.0f * (id(bms${bms_id}_state_of_charge).state / 100.0f);

  - platform: template
    id: bms${bms_id}_battery_capacity
    device_id: bms_${bms_id}
    name: "battery capacity"
    unit_of_measurement: "Ah"
    state_class: measurement
    lambda: return 300.0f;

  - platform: template
    id: bms${bms_id}_battery_soh
    device_id: bms_${bms_id}
    name: "state of health"
    unit_of_measurement: "%"
    state_class: measurement
    lambda: return 100.0f;

  # Max Charge Current: dynamically uses real-time Felicity BMS limit from 0x131E
  - platform: template
    id: bms${bms_id}_max_charge_current
    device_id: bms_${bms_id}
    name: "max charge current"
    unit_of_measurement: "A"
    state_class: measurement
    update_interval: ${bms_update_interval}
    lambda: |-
      if (id(bms${bms_id}_bms_max_charge_current_raw).has_state() && 
          id(bms${bms_id}_bms_max_charge_current_raw).state > 0.0f && 
          id(bms${bms_id}_bms_max_charge_current_raw).state <= 250.0f) {
        return id(bms${bms_id}_bms_max_charge_current_raw).state;
      }
      return ${bms_max_charge_current};

  # Max Discharge Current: dynamically uses real-time Felicity BMS limit from 0x131F
  - platform: template
    id: bms${bms_id}_max_discharge_current
    device_id: bms_${bms_id}
    name: "max discharge current"
    unit_of_measurement: "A"
    state_class: measurement
    update_interval: ${bms_update_interval}
    lambda: |-
      if (id(bms${bms_id}_bms_max_discharge_current_raw).has_state() && 
          id(bms${bms_id}_bms_max_discharge_current_raw).state > 0.0f && 
          id(bms${bms_id}_bms_max_discharge_current_raw).state <= 250.0f) {
        return id(bms${bms_id}_bms_max_discharge_current_raw).state;
      }
      return ${bms_max_discharge_current};

  - platform: template
    id: bms${bms_id}_cell_ovp
    device_id: bms_${bms_id}
    unit_of_measurement: "V"
    update_interval: ${bms_update_interval}
    lambda: |-
      if (id(bms${bms_id}_charge_voltage_limit).has_state() && id(bms${bms_id}_charge_voltage_limit).state >= 48.0f) {
        return (id(bms${bms_id}_charge_voltage_limit).state / ${yambms_cell_count});
      }
      return 3.65f;

  - platform: template
    id: bms${bms_id}_cell_uvp
    device_id: bms_${bms_id}
    unit_of_measurement: "V"
    update_interval: ${bms_update_interval}
    lambda: |-
      if (id(bms${bms_id}_discharge_voltage_limit).has_state() && id(bms${bms_id}_discharge_voltage_limit).state >= 40.0f) {
        return (id(bms${bms_id}_discharge_voltage_limit).state / ${yambms_cell_count}) - 0.2f;
      }
      return 2.80f;

  - platform: template
    id: bms${bms_id}_bms_balance_trigger_voltage
    device_id: bms_${bms_id}
    unit_of_measurement: "V"
    lambda: return 0.030f;

  - platform: template
    id: bms${bms_id}_charging_cycles_raw
    device_id: bms_${bms_id}
    lambda: return 0.0f;

  - platform: template
    id: bms${bms_id}_cycle_capacity_raw
    device_id: bms_${bms_id}
    unit_of_measurement: "Ah"
    lambda: return 0.0f;

  - platform: template
    id: bms${bms_id}_yambms_errors_bitmask
    device_id: bms_${bms_id}
    lambda: |-
      if (id(bms${bms_id}_bms_fault_raw).has_state()) {
        return (int)id(bms${bms_id}_bms_fault_raw).state;
      }
      return 0;

  # +---------------------------------------------------+
  # | 16 Cell Voltages (Registers 0x132A - 0x1339)      |
  # +---------------------------------------------------+
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_1
    device_id: bms_${bms_id}
    name: "cell voltage 1"
    address: 0x132A
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_2
    device_id: bms_${bms_id}
    name: "cell voltage 2"
    address: 0x132B
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_3
    device_id: bms_${bms_id}
    name: "cell voltage 3"
    address: 0x132C
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_4
    device_id: bms_${bms_id}
    name: "cell voltage 4"
    address: 0x132D
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_5
    device_id: bms_${bms_id}
    name: "cell voltage 5"
    address: 0x132E
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_6
    device_id: bms_${bms_id}
    name: "cell voltage 6"
    address: 0x132F
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_7
    device_id: bms_${bms_id}
    name: "cell voltage 7"
    address: 0x1330
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_8
    device_id: bms_${bms_id}
    name: "cell voltage 8"
    address: 0x1331
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_9
    device_id: bms_${bms_id}
    name: "cell voltage 9"
    address: 0x1332
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_10
    device_id: bms_${bms_id}
    name: "cell voltage 10"
    address: 0x1333
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_11
    device_id: bms_${bms_id}
    name: "cell voltage 11"
    address: 0x1334
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_12
    device_id: bms_${bms_id}
    name: "cell voltage 12"
    address: 0x1335
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
