    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_3
    device_id: bms_${bms_id}
    name: "cell voltage 3"
    address: 0x132C
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_4
    device_id: bms_${bms_id}
    name: "cell voltage 4"
    address: 0x132D
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_5
    device_id: bms_${bms_id}
    name: "cell voltage 5"
    address: 0x132E
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_6
    device_id: bms_${bms_id}
    name: "cell voltage 6"
    address: 0x132F
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_7
    device_id: bms_${bms_id}
    name: "cell voltage 7"
    address: 0x1330
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_8
    device_id: bms_${bms_id}
    name: "cell voltage 8"
    address: 0x1331
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_9
    device_id: bms_${bms_id}
    name: "cell voltage 9"
    address: 0x1332
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_10
    device_id: bms_${bms_id}
    name: "cell voltage 10"
    address: 0x1333
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_11
    device_id: bms_${bms_id}
    name: "cell voltage 11"
    address: 0x1334
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_12
    device_id: bms_${bms_id}
    name: "cell voltage 12"
    address: 0x1335
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_13
    device_id: bms_${bms_id}
    name: "cell voltage 13"
    address: 0x1336
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_14
    device_id: bms_${bms_id}
    name: "cell voltage 14"
    address: 0x1337
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_15
    device_id: bms_${bms_id}
    name: "cell voltage 15"
    address: 0x1338
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_16
    device_id: bms_${bms_id}
    name: "cell voltage 16"
    address: 0x1339
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # +---------------------------------------------------+
  # | 4 Cell Temperatures (Registers 0x133A - 0x133D)   |
  # +---------------------------------------------------+
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_temperature_sensor_1
    device_id: bms_${bms_id}
    name: "temperature sensor 1"
    address: 0x133A
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_temperature_sensor_2
    device_id: bms_${bms_id}
    name: "temperature sensor 2"
    address: 0x133B
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_temperature_sensor_3
    device_id: bms_${bms_id}
    name: "temperature sensor 3"
    address: 0x133C
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_temperature_sensor_4
    device_id: bms_${bms_id}
    name: "temperature sensor 4"
    address: 0x133D
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  # +---------------------------------------------------+
  # | Cell Analytics (Min, Max, Delta, Average)         |
  # +---------------------------------------------------+

  - platform: template
    id: bms${bms_id}_delta_voltage_cell
    device_id: bms_${bms_id}
    name: "delta cell voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: ${bms_update_interval}
    lambda: |-
      float min_v = 10.0f;
      float max_v = 0.0f;
      float sum_v = 0.0f;
      uint8_t min_id = 1;
      uint8_t max_id = 1;
      uint8_t count = 0;

      float cv[16] = {
        id(bms${bms_id}_cell_voltage_1).state,
        id(bms${bms_id}_cell_voltage_2).state,
        id(bms${bms_id}_cell_voltage_3).state,
        id(bms${bms_id}_cell_voltage_4).state,
        id(bms${bms_id}_cell_voltage_5).state,
        id(bms${bms_id}_cell_voltage_6).state,
        id(bms${bms_id}_cell_voltage_7).state,
        id(bms${bms_id}_cell_voltage_8).state,
        id(bms${bms_id}_cell_voltage_9).state,
        id(bms${bms_id}_cell_voltage_10).state,
        id(bms${bms_id}_cell_voltage_11).state,
        id(bms${bms_id}_cell_voltage_12).state,
        id(bms${bms_id}_cell_voltage_13).state,
        id(bms${bms_id}_cell_voltage_14).state,
        id(bms${bms_id}_cell_voltage_15).state,
        id(bms${bms_id}_cell_voltage_16).state
      };

      for (uint8_t i = 0; i < 16; i++) {
        if (!isnan(cv[i]) && cv[i] > 1.5f && cv[i] < 4.5f) {
          sum_v += cv[i];
          count++;
          if (cv[i] < min_v) { min_v = cv[i]; min_id = i + 1; }
          if (cv[i] > max_v) { max_v = cv[i]; max_id = i + 1; }
        }
      }

      if (count == 0) return NAN;

      id(bms${bms_id}_min_cell_voltage).publish_state(min_v);
      id(bms${bms_id}_max_cell_voltage).publish_state(max_v);
      id(bms${bms_id}_min_voltage_cell).publish_state(min_id);
      id(bms${bms_id}_max_voltage_cell).publish_state(max_id);
      id(bms${bms_id}_average_cell_voltage).publish_state(sum_v / count);

      return (max_v - min_v);

  - platform: template
    id: bms${bms_id}_min_cell_voltage
    device_id: bms_${bms_id}
    name: "min cell voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3

  - platform: template
