    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  - platform: modbus_controller
    modbus_controller_id: modbus_controller_bms${bms_id}
    id: bms${bms_id}_cell_voltage_16
    device_id: bms_${bms_id}
    name: "cell voltage 16"
    address: 0x1339
