# YamBMS (Yet another multi-BMS Merging Solution)
# Configuration for Waveshare ESP32-S3-RS485-CAN
# BMS 1: FelicityESS LUX-Y-48300LG01 (16S LiFePO4 300Ah) over RS-485 Modbus RTU
# Inverter: Deye Hybrid Inverter over CAN Bus (500 kbps, Lithium 00 / Pylon 1.2)
# Prepared for BMS 2: JK-BMS on dedicated SH1.0 port (uart_esp_2) or BLE
# Web Server v3 enabled with grouped dashboard

logger:
  level: DEBUG
  logs:
    modbus: VERBOSE
    modbus_controller: VERBOSE
  baud_rate: 0 # Освобождает внутренний UART для стабильности шин

ota:
  - platform: esphome

api:
  reboot_timeout: 0s

# +--------------------------------------+
# | Global Settings                      |
# +--------------------------------------+
substitutions:
  # Идентификатор ноды в сети
  hostname: 'yambms-felicity'
  friendly_name: 'YamBMS Felicity'

  # +------------------------------------+
  # | Параметры заряда YamBMS            |
  # +------------------------------------+
  yambms_id: '1'
  yambms_name: 'YamBMS 1'
  yambms_update_interval: '1s'
  yambms_input_number_mode: 'slider'

  # Тип химии и количество ячеек
  yambms_battery_chemistry: '1' # 1-LFP (LiFePO4) | 2-Li-ion | 3-LTO
  yambms_cell_count: '16'

  # Пороговые напряжения (16S LiFePO4) - согласовано с профилем Felicity LUX-Y-48300LG01 (57.6 В)
  yambms_bulk_v: '57.6'    # 3.60V / ячейка (напряжение Bulk/Absorption, как в оригинальной BMS)
  yambms_float_v: '54.0'   # 3.375V / ячейка (напряжение буферного режима Float)
  yambms_rebulk_v: '52.8'  # 3.30V / ячейка (порог возобновления полного заряда)
  yambms_eoc_timer: '30'   # Макс. время дозаряда (минуты)
  yambms_cutoff_timer: '60' # Таймер стабилизации окончания заряда (секунды)

  # Паспортные токовые лимиты для батареи Felicity LUX-Y-48300LG01 (300 А·ч)
  yambms_max_requested_charge_current: '150'   # Заряд: 0.5C (150 А)
  yambms_max_requested_discharge_current: '150' # Разряд: 0.5C (150 А)

  # Таблицы температурного ограничения тока
  yambms_charging_rate_table: |
    {
      { -0.1, 0.00 },
      {  0.0, 0.05 },
      {  5.0, 0.12 },
      { 10.0, 0.30 },
      { 20.0, 0.50 },
      { 25.0, 0.50 },
      { 45.0, 0.50 },
      { 50.0, 0.50 },
      { 55.0, 0.50 },
      { 60.0, 0.00 }
    }
  yambms_discharging_rate_table: |
    {
      {-30.0, 0.00 },
      {-20.0, 0.50 },
      {-10.0, 0.50 },
      { -5.0, 0.50 },
      {  0.0, 0.50 },
      {  5.0, 0.50 },
      { 45.0, 0.50 },
      { 50.0, 0.50 },
      { 55.0, 0.50 },
      { 60.0, 0.00 }
    }

  # Интервалы обновления данных
  shunt_update_interval: '3s'
  bms_update_interval: '3s'
  enable_led_logging: 'false'
  enable_health_logging: 'false'

# +--------------------------------------+
# | Пакеты (Remote Packages)             |
# +--------------------------------------+
packages:
  remote_packages:
    url: https://github.com/xpoh697/esphome-yambms
    ref: main
    refresh: 0s # 0s гарантирует немедленную загрузку свежих коммитов без ожидания кэша
    files:
      # Плата Waveshare ESP32-S3-RS485-CAN
      - path: 'packages/board/board_ESP32-S3_WS-RS485-CAN.yaml'

      # RS-485 порт платы (uart_esp_1, TX: GPIO17, RX: GPIO18)
      - path: 'packages/board/board_options_itf_uart_esp_1.yaml'

      # Управление направлением полудуплекса RS-485 (talk_pin: GPIO21)
      - path: 'packages/board/board_options_itf_uart_flow_control.yaml'
        vars:
          uart_id: 'uart_esp_1'
          uart_flow_control_pin: ${talk_pin}

      # CAN-интерфейс к инвертору Deye (TX: GPIO15, RX: GPIO16)
      - path: 'packages/board/board_options_itf_canbus_esp32_can.yaml'
        vars:
          canbus_node_id: 'canbus_inverter_1'

      # Оптимизация 8MB Octal PSRAM на частоте 80MHz
      - path: 'packages/board/board_options_PSRAM_octal_80Mhz.yaml'

      # +------------------------------------------------------------------------+
      # | Web Server (Дашборд и группировка сенсоров в браузере)                |
      # +------------------------------------------------------------------------+
      - path: 'packages/yambms/yambms_web_server.yaml'

      # +------------------------------------------------------------------------+
      # | BMS 1: FelicityESS LUX-Y-48300LG01                                    |
      # +------------------------------------------------------------------------+
      # Клиент Modbus RTU (9600 бод, 8N1)
      - path: 'packages/bms/bms_combine_Felicity_RS485_modbus.yaml'
        vars:
          felicity_modbus_uart_id: 'uart_esp_1'
          felicity_modbus_baud_rate: '9600'
          bms_max_charge_current: '150'
          bms_max_discharge_current: '150'

      # Сборщик телеметрии Felicity (побаночный контроль, токи, защита)
      - path: 'packages/bms/bms_combine_Felicity_RS485_bms_full.yaml'
        vars:
          bms_id: '1'
          bms_name: 'Felicity-BMS 1'
          bms_status_led_id: 'esp_light'
          bms_max_charge_current: '150'
          bms_max_discharge_current: '150'

      # +------------------------------------------------------------------------+
      # | BMS 2: Будущая JK-BMS (раскомментировать при подключении)             |
      # +------------------------------------------------------------------------+
      # Вариант 1 (проводной через разъем SH1.0 платы Waveshare: GPIO1/GPIO2):
      # - path: 'packages/board/board_options_itf_uart_esp_2.yaml'
      # - path: 'packages/bms/bms_combine_JK_RS485_Modbus_bms_standard.yaml'
      #   vars:
      #     bms_id: '2'
      #     bms_name: 'JK-BMS 2'
      #     bms_status_led_id: 'esp_light'
      #
      # Вариант 2 (беспроводной по Bluetooth LE):
      # - path: 'packages/bms/bms_combine_JK_BLE_standard.yaml'
      #   vars:
      #     bms_id: '2'
      #     bms_name: 'JK-BMS 2'
      #     bms_status_led_id: 'esp_light'
      #     bms_mac_address: 'XX:XX:XX:XX:XX:XX'

      # Ядро объединения YamBMS
      - path: 'packages/yambms/yambms.yaml'

      # Передача данных в инвертор Deye по CAN с поддержкой веб-сервера
      - path: 'packages/yambms/yambms_canbus_web_server.yaml'
        vars:
          canbus_id: '1'
          canbus_name: 'CANBUS 1'
          canbus_node_id: 'canbus_inverter_1'
          canbus_status_led_id: 'esp_light'
          canbus_link_timer_enabled: 'true'
          canbus_link_timer: '5s'
          canbus_extended_ack: 'false'

      # Диагностика и мониторинг памяти PSRAM
      - path: 'packages/base/device_debug_ESP32_PSRAM.yaml'
        vars:
          debug_name: 'Debug'
          debug_update_interval: '10s'
          debug_psram_size: '8388608'

